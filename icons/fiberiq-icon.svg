<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <!-- Background -->
  <rect width="512" height="512" rx="110"
        fill="#0b5ed7"/>

  <!-- Inner NOC panel -->
  <rect x="42" y="42"
        width="428"
        height="428"
        rx="82"
        fill="#f4f8fb"/>

  <!-- Fibre cable -->
  <path d="M82 322
           C145 322 165 210 230 210
           C300 210 315 322 430 322"
        fill="none"
        stroke="#0b5ed7"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Fibre light -->
  <path d="M82 322
           C145 322 165 210 230 210"
        fill="none"
        stroke="#00b8ff"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Fault point -->
  <circle cx="230"
          cy="210"
          r="30"
          fill="#ff3b30"/>

  <circle cx="230"
          cy="210"
          r="12"
          fill="#ffffff"/>

  <!-- Signal waves -->
  <path d="M292 151
           C326 166 347 194 354 226"
        fill="none"
        stroke="#00b8ff"
        stroke-width="10"
        stroke-linecap="round"/>

  <path d="M318 125
           C366 147 397 184 405 229"
        fill="none"
        stroke="#00b8ff"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.65"/>

  <!-- FiberIQ text -->
  <text x="256"
        y="402"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        fill="#12304a">
    FiberIQ
  </text>

  <!-- Small subtitle -->
  <text x="256"
        y="438"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="3"
        fill="#0b5ed7">
    FIBRE FAULT LOCATOR
  </text>

</svg>
